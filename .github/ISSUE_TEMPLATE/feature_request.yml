name: 功能建议
description: 提出新功能想法或体验改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 痛点
      description: 这个建议希望解决什么实际问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述你希望看到的交互或能力。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明（可选）
