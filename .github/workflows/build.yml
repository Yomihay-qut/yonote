name: Test, Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, test and build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/
          retention-days: 7

  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test and vet backend
        working-directory: server
        run: |
          go vet ./...
          go test -count=1 -v ./...
      - name: Build portable server binaries
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../release
          VER="${GITHUB_REF_NAME#v}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.appVersion=${VER}" -o ../release/yonote-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.appVersion=${VER}" -o ../release/yonote-linux-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.appVersion=${VER}" -o ../release/yonote-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: release/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker image build
        run: docker build --build-arg APP_VERSION="${GITHUB_REF_NAME#v}" -t yonote:ci .

  android:
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-24.04
    outputs:
      signed: ${{ steps.check_signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - name: Sync Android
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx cap sync android
      - name: Check signing secrets availability
        id: check_signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_BASE64 not configured; building debug APK for verification."
          fi
      - name: Decode release signing key
        if: steps.check_signing.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/yonote.jks"
          chmod 600 "$RUNNER_TEMP/yonote.jks"
      - name: Build signed release APK
        if: steps.check_signing.outputs.signed == 'true'
        working-directory: web/android
        env:
          YONOTE_KEYSTORE: ${{ runner.temp }}/yonote.jks
          YONOTE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YONOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YONOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          YONOTE_VERSION_CODE: ${{ github.run_number }}
          YONOTE_VERSION_NAME: ${{ github.ref_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify app/build/outputs/apk/release/app-release.apk
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/yonote.apk
      - name: Build debug APK (fallback when signing secrets are absent)
        if: steps.check_signing.outputs.signed != 'true'
        working-directory: web/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/yonote.jks"
      - uses: actions/upload-artifact@v4
        if: steps.check_signing.outputs.signed == 'true'
        with:
          name: android
          path: web/release/yonote.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, server, docker, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package complete self-hosted app
        run: |
          mkdir -p release bundle/web bundle/deploy
          cp -a artifacts/web/. bundle/web/
          cp -a deploy/. bundle/deploy/
          cp README.md LICENSE bundle/
          cd artifacts/web && zip -qr ../../release/yonote-web.zip . && cd ../..
          if [ -f artifacts/android/yonote.apk ]; then
            cp artifacts/android/yonote.apk "release/yonote-${GITHUB_REF_NAME}.apk"
          fi
          for platform in linux-amd64 linux-arm64; do
            cp "artifacts/server/yonote-${platform}" bundle/yonote
            chmod +x bundle/yonote
            tar -C bundle -czf "release/yonote-${platform}-${GITHUB_REF_NAME}.tar.gz" .
          done
          cp artifacts/server/yonote-windows-amd64.exe bundle/yonote.exe
          rm bundle/yonote
          cd bundle && zip -qr "../release/yonote-windows-amd64-${GITHUB_REF_NAME}.zip" . && cd ..
          cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -n "$TAG_NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "便签 $GITHUB_REF_NAME" --notes "$TAG_NOTES"
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "便签 $GITHUB_REF_NAME" --generate-notes
          fi
