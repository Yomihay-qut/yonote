# Replace notes.example.com with your actual domain.
# TLS is supplied by your existing reverse proxy/certbot configuration.
# Recommended in http {} (e.g. /etc/nginx/conf.d/yonote-ratelimit.conf):
#   limit_req_zone $binary_remote_addr zone=yonote_login:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=yonote_api:10m rate=120r/m;

server {
    listen 443 ssl http2;
    server_name notes.example.com;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    client_max_body_size 51m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Block dotfiles and common backup/source-map probes with 404 (not SPA fallback)
    location ~ /\.(?!well-known) {
        return 404;
    }
    location ~* \.(map|sql|db|bak|env|sh)$ {
        return 404;
    }

    location = /api/login {
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /mcp {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
